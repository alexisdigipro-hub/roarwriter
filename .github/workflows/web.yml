name: RoarWriter on the web

# Every push to main checks the app and puts app/ online as the web version (the gh-pages branch, served by
# GitHub Pages at https://alexisdigipro-hub.github.io/roarwriter/). A pull request only runs the checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax of every script
        run: |
          for f in electron/*.js; do node --check "$f"; done
          for f in app/js/*.js; do node --input-type=module --check < "$f"; done
          node -e "require('./package.json')"
      - name: Fountain round trip
        run: |
          cat > /tmp/t.mjs <<'JS'
          globalThis.crypto ??= (await import('node:crypto')).webcrypto
          const { parseFountain, toFountain } = await import(process.cwd() + '/app/js/fountain.js')
          const s = parseFountain('ΕΣΩΤ. ΚΟΥΖΙΝΑ - ΝΥΧΤΑ\n\nΗ Μαρία μπαίνει.\n\nΜΑΡΙΑ\n(ήσυχα)\nΚαλησπέρα.\n\nINT. ROOM - DAY\n\nJOHN\nHi.\n')
          const kinds = s.els.map((e) => e.t).join(',')
          if (kinds !== 'scene,action,character,paren,dialogue,scene,character,dialogue') throw new Error('parse: ' + kinds)
          const back = parseFountain(toFountain(s)).els.map((e) => e.t + e.x).join('|')
          if (back !== s.els.map((e) => e.t + e.x).join('|')) throw new Error('round trip')
          console.log('fountain ok')
          JS
          node /tmp/t.mjs

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put app/ on the gh-pages branch
        run: |
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "RoarWriter web from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
